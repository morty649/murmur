name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Fetch sherpa-onnx AAR
        run: bash scripts/fetch-sherpa.sh

      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.MURMUR_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/murmur.p12"
            echo "MURMUR_KEYSTORE=$RUNNER_TEMP/murmur.p12" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing key secret; using a throwaway debug key."
          fi

      - name: Build
        env:
          VERSION_CODE: ${{ github.run_number }}
          MURMUR_KEYSTORE_PASSWORD: ${{ secrets.MURMUR_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Collect APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/Murmur-0.1.${{ github.run_number }}.apk"
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: Murmur-apk
          path: out/*.apk

      - name: Publish "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest out/*.apk \
            --target "$GITHUB_SHA" \
            --title "Murmur 0.1.${{ github.run_number }}" \
            --notes "Latest build from ${GITHUB_SHA::7}. Download the APK on your phone and install it."
